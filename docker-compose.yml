services:
  db:
    image: postgres:15-alpine
    container_name: project_01-db
    environment:
      POSTGRES_DB: "notes_db_01"
      POSTGRES_USER: "notes_user_01"
      POSTGRES_PASSWORD: "password123"
    volumes:
      - pgdata_01:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5401:5432"
    networks:
      - project_01-network

  backend:
    build:
      context: ./backend
    container_name: project_01-backend
    environment:
      DB_HOST: db
      DB_NAME: "notes_db_01"
      DB_USER: "notes_user_01"
      DB_PASS: "password123"
    ports:
      - "5001:5000"
    depends_on:
      - db
    networks:
      - project_01-network

  nginx:
    image: nginx:alpine
    container_name: project_01-nginx
    ports:
      - "8001:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - project_01-network

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: project_01-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata_01:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9001:9090" # Внешний порт вашей группы (например, 9003) -> 9090 внутри
    depends_on:
      - backend
    networks:
      - project_01-network

  grafana:
    image: grafana/grafana:10.0.0
    container_name: project_01-grafana
    ports:
      - "3001:3000" # Внешний порт вашей группы (например, 3003) -> 3000 внутри
    volumes:
      - grafanadata_01:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - project_01-network

volumes:
  pgdata_01:
  promdata_01:
  grafanadata_01:

networks:
  project_01-network:
    name: project_01-network
