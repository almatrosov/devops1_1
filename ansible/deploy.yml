---
- name: Deploy Project 1 (Version 2 - Ansible with GitHub Integration)
  hosts: webservers
  become: true
  vars:
    # URL репозитория (студенты меняют на свой форк)
    repo_url: "https://github.com/almatrosov/devops1_1"
    repo_branch: "main"

    # Параметры окружения
    nginx_port: 8081
    backend_port: 5001
    db_name: "notes_db"
    db_user: "notes_user"
    db_password: "password123"

    repo_root: "/opt/project1"
    backend_dir: "/opt/project1/backend"
    frontend_www_dir: "/var/www/project1"

  tasks:
    - name: 1. Обновить кэш apt и установить системные пакеты
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-venv
          - postgresql
          - postgresql-contrib
          - nginx
          - git
        state: present
        update_cache: yes

    - name: 2. Проверить, существует ли база данных
      ansible.builtin.shell: "sudo -u postgres psql -tAc \"SELECT 1 FROM pg_database WHERE datname='{{ db_name }}'\""
      register: db_exists
      changed_when: false

    - name: 3. Создать базу данных PostgreSQL
      ansible.builtin.shell: "sudo -u postgres psql -c \"CREATE DATABASE {{ db_name }};\""
      when: db_exists.stdout != "1"

    - name: 4. Проверить, существует ли пользователь базы данных
      ansible.builtin.shell: "sudo -u postgres psql -tAc \"SELECT 1 FROM pg_roles WHERE rolname='{{ db_user }}'\""
      register: user_exists
      changed_when: false

    - name: 5. Создать пользователя базы данных и задать пароль
      ansible.builtin.shell: "sudo -u postgres psql -c \"CREATE USER {{ db_user }} WITH PASSWORD '{{ db_password }}';\""
      when: user_exists.stdout != "1"

    - name: 6. Предоставить права пользователю на БД
      ansible.builtin.shell: "sudo -u postgres psql -c \"GRANT ALL PRIVILEGES ON DATABASE {{ db_name }} TO {{ db_user }};\""
      changed_when: false

    - name: 7. Создать структуру таблиц (если не создана)
      ansible.builtin.shell: |
        sudo -u postgres psql -d {{ db_name }} -c "
        CREATE TABLE IF NOT EXISTS notes (
            id SERIAL PRIMARY KEY,
            title VARCHAR(100) NOT NULL,
            content TEXT NOT NULL
        );
        GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO {{ db_user }};
        GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO {{ db_user }};
        "
      register: table_init
      changed_when: "'CREATE TABLE' in table_init.stdout"

    # --- ОЧИСТКА КОНФЛИКТОВ ВЕРСИИ 1 И ЗАГРУЗКА ИЗ GIT ---

    - name: 8. Проверить, настроен ли уже Git в целевой папке /opt/project1
      ansible.builtin.stat:
        path: "{{ repo_root }}/.git"
      register: git_folder

    - name: 9. Удалить остатки ручной сборки (если папка существует, но это не Git-репозиторий)
      ansible.builtin.file:
        path: "{{ repo_root }}"
        state: absent
      when: not git_folder.stat.exists

    - name: 10. Клонировать или обновить исходный код из GitHub
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_root }}"
        version: "{{ repo_branch }}"
        force: yes

    # --- ДЕПЛОЙ ПРИЛОЖЕНИЯ ---

    - name: 11. Настроить Python Virtual Environment для бэкенда и установить зависимости
      ansible.builtin.pip:
        requirements: "{{ backend_dir }}/requirements.txt"
        virtualenv: "{{ backend_dir }}/venv"
        virtualenv_command: python3 -m venv

    - name: 12. Создать Systemd юнит-файл бэкенда из шаблона
      ansible.builtin.template:
        src: templates/project1-backend.service.j2
        dest: /etc/systemd/system/project1-backend.service
        mode: '0644'
      notify: Reload Systemd

    - name: 13. Убедиться, что служба бэкенда включена и перезапущена с новым кодом
      ansible.builtin.systemd:
        name: project1-backend.service
        state: restarted
        enabled: yes

    - name: 14. Создать директорию для статики фронтенда
      ansible.builtin.file:
        path: "{{ frontend_www_dir }}"
        state: directory
        mode: '0755'
        owner: www-data
        group: www-data

    - name: 15. Скопировать index.html в рабочий каталог Nginx
      ansible.builtin.copy:
        src: "{{ repo_root }}/frontend/index.html"
        dest: "{{ frontend_www_dir }}/index.html"
        remote_src: yes
        mode: '0644'
        owner: www-data
        group: www-data

    - name: 16. Создать конфигурацию Nginx из шаблона
      ansible.builtin.template:
        src: templates/project1.conf.j2
        dest: /etc/nginx/sites-available/project1.conf
        mode: '0644'
      notify: Restart Nginx

    - name: 17. Активировать конфигурацию Nginx через символическую ссылку
      ansible.builtin.file:
        src: /etc/nginx/sites-available/project1.conf
        dest: /etc/nginx/sites-enabled/project1.conf
        state: link
      notify: Restart Nginx

    - name: 18. Удалить дефолтный конфиг Nginx (предотвращение конфликтов)
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart Nginx

  handlers:
    - name: Reload Systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Restart Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted